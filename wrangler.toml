# מועצת ה-AI — a separate Worker (not the routes app). Deployed by .github/workflows/deploy.yml on every push to main.
name = "ai-council"
main = "src/worker.js"
compatibility_date = "2026-11-01"
account_id = "4c505a604c33511cea5c1637e52cd3fc"
workers_dev = true

# 📜 saved discussions
[[durable_objects.bindings]]
name = "ARCHIVE"
class_name = "Archive"

[[migrations]]
tag = "v1-archive"
new_sqlite_classes = ["Archive"]

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html"]

# model names — change here if a company retires a model (no keys here: the keys are Worker secrets, set from GitHub secrets)
[vars]
OPENAI_MODEL = "gpt-5.6-terra"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_FALLBACK = "gemini-3.5-flash-lite,gemini-3.1-flash-lite"
